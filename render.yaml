services:
  - type: web
    name: avicena
    runtime: node
    plan: free
    buildCommand: npm install && npm run build
    startCommand: npm start
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: APP_ENV
        value: production
      - key: AUDIT_HMAC_SECRET
        generateValue: true
      - key: VAULT_ENCRYPTION_SECRET
        generateValue: true
      - key: WORM_AUDIT_STREAM_ENABLED
        value: "true"
      - key: FIREBASE_APP_CHECK_ENFORCED
        value: "false"
      - key: GEMINI_API_KEY
        sync: false
